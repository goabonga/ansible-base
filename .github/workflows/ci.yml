---

name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-suffix: ${{ github.job }}
          python-version: "3.12"
      - run: uv sync --frozen --only-group dev
      # The template directory is Jinja, not YAML: `{% raw %}{% endraw %}` and
      # `{{ cookiecutter.x }}` are not parseable, so only the repository's own
      # files are linted here. The generated project is linted in `generate`,
      # after rendering has turned it back into valid YAML.
      - run: uv run --no-sync yamllint --strict .github tests
      - run: uv run --no-sync ruff check --output-format=github hooks tests
      - run: uv run --no-sync ruff format --check hooks tests

  generate:
    # The contract: a project generated from the defaults must pass the very
    # gates its own CI runs. Both interpreters, because the generated project
    # claims to support both.
    name: generate (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-suffix: ${{ github.job }}-${{ matrix.python-version }}
          python-version: ${{ matrix.python-version }}
      - run: uv sync --frozen --only-group dev
      - name: Install the Galaxy collections the generated project needs
        run: >-
          uv run --no-sync ansible-galaxy collection install
          -r '{{cookiecutter.project_slug}}/requirements.yml' -p collections
      - name: Generate a project and run its gates against it
        run: uv run --no-sync pytest -v

  bandit:
    name: bandit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-suffix: ${{ github.job }}
          python-version: "3.12"
      - run: uvx bandit --recursive hooks

  osv-scanner:
    name: osv-scanner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install OSV-Scanner
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSfL \
            "https://github.com/google/osv-scanner/releases/latest/download/osv-scanner_linux_amd64" \
            -o "$HOME/.local/bin/osv-scanner"
          chmod +x "$HOME/.local/bin/osv-scanner"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: osv-scanner scan source --lockfile=uv.lock
