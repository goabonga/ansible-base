# This repository ships a cookiecutter template, not a Python distribution.
# The project metadata exists so `uv` can manage the toolchain used to test
# the template: cookiecutter itself, pytest, and the very linters the
# generated project runs in its own CI. `package = false` keeps uv from
# trying to build a wheel.

[project]
name = "ansible-base"
version = "0.0.0"
description = "Cookiecutter template for disposable KVM/QEMU Ansible labs."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Chris", email = "goabonga@pm.me" }]
keywords = ["cookiecutter", "template", "ansible", "kvm", "libvirt", "qemu"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Installation/Setup",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/goabonga/ansible-base"
Repository = "https://github.com/goabonga/ansible-base"
Issues = "https://github.com/goabonga/ansible-base/issues"

[tool.uv]
package = false

[dependency-groups]
dev = [
    "cookiecutter>=2.6",
    "pytest>=8",
    # The generated project's own gates, so the test suite can run them
    # against the freshly generated tree.
    "ansible-core>=2.18",
    "ansible-lint>=25",
    "yamllint>=1.35",
    "ruff>=0.13",
    "pre-commit>=4",
]

[tool.ruff]
target-version = "py311"
line-length = 88
# The template directory is Jinja, not Python: `{{cookiecutter.project_slug}}`
# is not a valid identifier and its contents are not importable.
extend-exclude = ["{{cookiecutter.project_slug}}"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
